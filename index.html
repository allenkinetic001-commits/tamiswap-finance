<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#01030b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/png" href="/assets/aistudio/tamiswap_00325eac.png" />
    <title>TamiSwap · BNB Chain DEX</title>
    <meta name="description" content="Futuristic BNB Smart Chain DEX swap powered by THENA RouterV2 and PairFactory." />
    <meta property="og:title" content="TamiSwap · BNB Chain DEX" />
    <meta property="og:description" content="Futuristic BNB Smart Chain DEX swap powered by THENA RouterV2 and PairFactory." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Orbitron:wght@500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Orbitron:wght@500;600;700;800&display=swap" rel="stylesheet"></noscript>
    <script>
      (function () {
        if (typeof globalThis === 'undefined') {
          window.globalThis = window;
        }
        if (typeof Object.hasOwn !== 'function') {
          Object.defineProperty(Object, 'hasOwn', {
            value: function (obj, prop) {
              return Object.prototype.hasOwnProperty.call(obj, prop);
            },
            configurable: true,
            writable: true,
          });
        }
        if (!String.prototype.replaceAll) {
          String.prototype.replaceAll = function (search, replacement) {
            var str = String(this);
            if (search instanceof RegExp) {
              if (!search.global) throw new TypeError('replaceAll must be called with a global RegExp');
              return str.replace(search, replacement);
            }
            return str.split(String(search)).join(typeof replacement === 'function' ? replacement(search) : String(replacement));
          };
        }
        if (!Array.prototype.at) {
          Object.defineProperty(Array.prototype, 'at', {
            value: function (n) {
              var len = this.length >>> 0;
              var i = Math.trunc(n) || 0;
              if (i < 0) i += len;
              return i < 0 || i >= len ? undefined : this[i];
            },
            configurable: true,
            writable: true,
          });
        }
        if (typeof Promise !== 'undefined' && typeof Promise.allSettled !== 'function') {
          Promise.allSettled = function (promises) {
            return Promise.all(
              Array.prototype.map.call(promises, function (p) {
                return Promise.resolve(p).then(
                  function (value) { return { status: 'fulfilled', value: value }; },
                  function (reason) { return { status: 'rejected', reason: reason }; }
                );
              })
            );
          };
        }

        function showBootError(reason) {
          var root = document.getElementById('root');
          if (!root || window.__TAMISWAP_MOUNTED__) return;
          try {
            var key = 'tamiswap_boot_retry';
            if (!sessionStorage.getItem(key)) {
              sessionStorage.setItem(key, '1');
              var sep = window.location.search ? '&' : '?';
              window.location.replace(window.location.pathname + window.location.search + sep + 'v=' + Date.now() + window.location.hash);
              return;
            }
          } catch (e) {}
          var msg = document.getElementById('boot-status-text');
          var btn = document.getElementById('boot-reload-btn');
          var errBox = document.getElementById('boot-error-detail');
          if (msg) msg.textContent = 'This browser had trouble loading TamiSwap.';
          if (errBox && reason) {
            errBox.textContent = String(reason).slice(0, 160);
            errBox.style.display = 'block';
          }
          if (btn) btn.style.display = 'inline-block';
        }

        window.addEventListener('error', function (ev) {
          if (!window.__TAMISWAP_MOUNTED__) {
            var target = ev && ev.target;
            if (target && target.tagName === 'SCRIPT') {
              showBootError('Network or cache mismatch loading app script.');
            } else if (ev && ev.message && (!ev.filename || ev.filename.indexOf(window.location.origin) === 0)) {
              showBootError(ev.message);
            }
          }
        }, true);

        window.setTimeout(function () {
          if (!window.__TAMISWAP_MOUNTED__) {
            var msg = document.getElementById('boot-status-text');
            var btn = document.getElementById('boot-reload-btn');
            if (msg) msg.textContent = 'Taking longer than usual to load on this network...';
            if (btn) btn.style.display = 'inline-block';
          }
        }, 7000);
      })();
    </script>
  </head>
  <body class="bg-[#02040a] text-slate-100 antialiased selection:bg-sky-400/35 selection:text-cyan-100">
    <div id="root">
      <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:#01030b;color:#eaf4ff;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;text-align:center;">
        <img src="/assets/aistudio/tamiswap_00325eac.png" alt="TamiSwap" width="64" height="64" style="width:64px;height:64px;object-fit:contain;margin-bottom:14px;" />
        <div style="font-size:16px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#7dd3fc;">TamiSwap</div>
        <div id="boot-status-text" style="margin-top:8px;font-size:13px;color:#94a3b8;">Loading BNB Chain DEX...</div>
        <div id="boot-error-detail" style="display:none;margin-top:10px;max-width:320px;font-size:11px;color:#fda4af;word-break:break-word;"></div>
        <button id="boot-reload-btn" type="button" onclick="window.location.href=window.location.pathname+'?r='+Date.now()" style="display:none;margin-top:16px;padding:10px 18px;border:1px solid #38bdf8;border-radius:8px;background:#0369a1;color:#ffffff;font-size:12px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;cursor:pointer;">Reload TamiSwap</button>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
